[package]
name = "farm-gpu"
description = "A wgpu renderer for farm-render draw lists: the desktop player's GPU backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
farm-render = { path = "../farm-render" }
# Vulkan (Linux, Windows), DirectX 12 (Windows) and Metal (macOS) only: no OpenGL backend and no
# WebGPU. A machine without one of them plays on the CPU renderer.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12", "metal"] }

[lints]
workspace = true
