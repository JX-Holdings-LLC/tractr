[package]
name = "farm-ffi"
description = "C ABI over farm-sim for .NET (FarmEngine.Interop)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "farm_ffi"
crate-type = ["cdylib", "rlib"]

[features]
default = ["audio-out"]
# Play Mode's sound on the default output device (cpal). On Linux cpal links ALSA.
# The editor build also ships a no-default-features libfarm_ffi_silent.so and automatically
# loads it if the normal library cannot load, so missing ALSA disables only sound.
# FarmFfiAudio=false builds just the silent engine under the normal library filename.
audio-out = ["farm-player/audio-out"]

[dependencies]
farm-sim = { path = "../farm-sim" }
# The JSON protocol (shared with farm-wasm); this crate is the C ABI around it.
farm-host = { path = "../farm-host" }
# The embeddable player without the desktop window/audio/gamepad layer.
farm-player = { path = "../farm-player", default-features = false }

[dev-dependencies]
farm-cart = { path = "../farm-cart" }
farm-render = { path = "../farm-render" }
serde_json.workspace = true

# The crate's own lint tables replace the workspace's, so they repeat its rules; the one
# difference is that `unsafe` is allowed here (it only dereferences pointers .NET hands it), with
# every unsafe operation in its own block and every block justified by a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
