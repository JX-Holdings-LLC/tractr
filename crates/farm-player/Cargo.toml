[package]
name = "farm-player"
description = "The Tractr game player: headless replays, the embeddable graphical player and the desktop game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["desktop", "gpu"]
# The desktop game: a window (winit + softbuffer), gamepads (gilrs), audio (cpal), user folders
# (directories) and the system language (sys-locale). Without it the crate is the
# platform-independent player library (what farm-ffi embeds in the editor, and what builds for
# wasm32).
desktop = ["audio-out", "dep:winit", "dep:softbuffer", "dep:gilrs", "dep:directories", "dep:sys-locale"]
# Sound output on the default device (cpal), without the rest of the desktop game: the editor's
# Play Mode.
audio-out = ["dep:cpal"]
# The desktop game's GPU renderer (farm-gpu: wgpu on Vulkan, DirectX 12 or Metal), chosen at run time
# with --renderer, FARM_RENDERER or the display.renderer setting; the CPU renderer stays the
# fallback and the reference.
gpu = ["desktop", "dep:farm-gpu"]

[dependencies]
farm-cart = { path = "../farm-cart" }
farm-sim = { path = "../farm-sim" }
farm-runtime = { path = "../farm-runtime" }
farm-plugins = { path = "../farm-plugins" }
farm-render = { path = "../farm-render" }
farm-ui = { path = "../farm-ui" }
farm-gpu = { path = "../farm-gpu", optional = true }
serde.workspace = true
serde_json.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
# A game's own sounds and music (M2): Ogg Vorbis and WAV, decoded once when the game loads.
lewton = "0.10"
hound = "3.5"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
gilrs = { version = "0.11", optional = true }
cpal = { version = "0.18", optional = true }
directories = { version = "6", optional = true }
sys-locale = { version = "0.3", optional = true }

# build.rs embeds placeholder icon and version resources when the target is Windows;
# Export Game patches them (docs/EXPORT.md).
[build-dependencies]
embed-resource = "3"

[lints]
workspace = true

# The GPU renderer against the CPU one (skips without a GPU adapter).
[[test]]
name = "gpu_parity"
required-features = ["gpu"]
